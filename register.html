<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - EventBook</title>

    <link rel="stylesheet" href="css/register.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            Event<span>Book</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="index.html#about">About</a>
            <a href="index.html#contact">Contact</a>
            <a href="login.html" class="login-btn">Login</a>
        </nav>

    </header>


    <!-- Register Section -->
    <main class="register-section">

        <div class="register-container">

            <div class="register-card">

                <!-- Header -->
                <div class="register-header">

                    <div class="register-icon">
                        👤
                    </div>

                    <h1>Create Your Account</h1>

                    <p>
                        Join EventBook and start booking your favorite events.
                    </p>

                </div>


                <!-- Registration Form -->
                <form id="registerForm">

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <!-- Terms -->
                    <div class="terms">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>

                        </label>

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="register-button"
                    >
                        Create Account
                    </button>


                    <!-- Message -->
                    <p
                        id="registerMessage"
                        class="register-message"
                    ></p>

                </form>


                <!-- Login Link -->
                <div class="login-section">

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login here
                        </a>
                    </p>

                </div>


                <!-- Back Home -->
                <div class="back-home">

                    <a href="index.html">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 EventBook. All Rights Reserved.
        </p>

    </footer>


    <script src="js/register.js"></script>

</body>
</html>
